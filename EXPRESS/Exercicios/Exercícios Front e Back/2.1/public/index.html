<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardápio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .filtro {
            margin-bottom: 25px;
            text-align: center;
        }

        select {
            padding: 10px;
            font-size: 16px;
        }

        #pratos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .disponivel {
            color: green;
            font-weight: bold;
        }

        .indisponivel {
            color: red;
            font-weight: bold;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #d33;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🍽️ Cardápio</h1>

    <div class="filtro">
        <label for="categoria">Categoria:</label>

        <select id="categoria">
            <option value="">Todas</option>
        </select>
    </div>

    <div id="pratos"></div>

    <script src="/js/lista.js"></script>

</body>

</html>
