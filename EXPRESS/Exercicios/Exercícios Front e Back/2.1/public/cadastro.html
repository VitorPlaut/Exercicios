<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Prato</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        form {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #mensagem {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <form id="formulario">

        <h1>Cadastrar Prato</h1>

        <label>Nome:</label>
        <input type="text" id="nome">

        <label>Descrição:</label>
        <textarea id="descricao"></textarea>

        <label>Preço:</label>
        <input type="number" id="preco" step="0.01">

        <label>Categoria:</label>
        <select id="categoria">
            <option value="">Selecione</option>
        </select>

        <button type="submit">
            Cadastrar
        </button>

        <p id="mensagem"></p>

    </form>

    <script src="/js/cadastro.js"></script>

</body>

</html>
