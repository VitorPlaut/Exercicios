<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameShelf — Cadastrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>🎮 GameShelf</h1>
        <nav>
            <a href="/">Biblioteca</a>
            <a href="/cadastro.html">Adicionar Jogo</a>
        </nav>
    </header>

    <main>
        <h2>Adicionar Jogo</h2>

        <form id="form-cadastro">

            <div class="campo">
                <label for="titulo">Título *</label>
                <input type="text" id="titulo" required placeholder="Ex: Elden Ring">
            </div>

            <div class="campo">
                <label for="preco">Preço *</label>
                <input type="number" id="preco" required min="0" step="0.01"
                       placeholder="Ex: 199.90">
            </div>

            <div class="campo">
                <label for="nota">Nota (0 a 10)</label>
                <input type="number" id="nota" min="0" max="10" step="0.1"
                       placeholder="Ex: 9.5">
            </div>

            <div class="campo">
                <label for="ano">Ano de lançamento</label>
                <input type="number" id="ano" min="1970" max="2099"
                       placeholder="Ex: 2022">
            </div>

            <div class="campo">
                <label for="plataforma">Plataforma *</label>
                <select id="plataforma" required>
                    <option value="">Carregando...</option>
                </select>
            </div>

            <div class="campo">
                <label for="categoria">Categoria *</label>
                <select id="categoria" required>
                    <option value="">Carregando...</option>
                </select>
            </div>

            <button type="submit">Adicionar Jogo</button>

        </form>

        <p id="mensagem"></p>
    </main>

    <script src="js/cadastro.js"></script>
</body>
</html>
